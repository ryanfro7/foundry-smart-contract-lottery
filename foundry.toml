[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
   '@chainlink/contracts/=lib/chainlink/contracts/src/',
   '@solmate=lib/solmate/src/',
   '@openzeppelin/=lib/openzeppelin-contracts/',
]
coverage_ignored_paths = [
   "./src/Raffle_Old.sol",
   "./test/mocks/LinkToken.sol",
   "./test/mocks/**/*",
   "./script/**/*",
   "./lib/**/*"
]
fs_permissions = [
   { access = "read", path = "./broadcast" },
   { access = "read", path = "./reports" },
]
optimizer = true
optimizer_runs = 200
solc_version = "0.8.19"

# Explicitly set the wallet for Foundry
wallet = "default"  # Change this to your preferred wallet name (e.g., "default" or "defaultKey")

[fuzz]
runs = 256

[profile.env]
ETHERSCAN_API_KEY = "${ETHERSCAN_API_KEY}"
SEPOLIA_RPC_URL = "${SEPOLIA_RPC_URL}"
