name: Foundry Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Foundry
      run: |
        curl -L https://foundry.paradigm.xyz | bash
        source ~/.foundry/bin/foundryup
        forge install

    - name: Set environment variables
      run: |
        echo "SEPOLIA_PRIVATE_KEY=${{ secrets.SEPOLIA_PRIVATE_KEY }}" >> $GITHUB_ENV
        echo "SEPOLIA_RPC_URL=${{ secrets.SEPOLIA_RPC_URL }}" >> $GITHUB_ENV
        echo "ETHERSCAN_API_KEY=${{ secrets.ETHERSCAN_API_KEY }}" >> $GITHUB_ENV

    - name: Run Foundry Tests
      run: forge test -vvv
